# Mac App Store build. Scripts/appstore.sh generates ZemyAppStore.xcodeproj next to this file.
name: ZemyAppStore
options:
  deploymentTarget: { macOS: "15.0" }
packages:
  ZemyKit: { path: .. }
targets:
  Zemy:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/Zemy/main.swift
      - path: PrivacyInfo.xcprivacy
      - path: ../build/appstore/Assets.xcassets
      - path: ../Vendor/CWebP/COPYING
        buildPhase: resources
    dependencies:
      - package: ZemyKit
    settings:
      base:
        PRODUCT_NAME: Zemy
        PRODUCT_BUNDLE_IDENTIFIER: app.zemy.mac
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Zemy.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        DEAD_CODE_STRIPPING: YES
schemes:
  Zemy:
    build: { targets: { Zemy: all } }
    archive: { config: Release }
